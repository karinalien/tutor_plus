<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание - Кабинет ученика</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .dashboard-title {
            color: #FEFCF8 !important;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-info h1 {
            color: #FEFCF8;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-info h2 {
            color: #FEFCF8;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #FEFCF8;
            opacity: 0.8;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .schedule-container {
            padding: 20px;
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .schedule-item {
            background: linear-gradient(135deg, #FEFCF8, #F5F0E8);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #88746b;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .schedule-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #88746b, #6B5B73);
        }

        .schedule-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(136, 116, 107, 0.15);
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .schedule-time {
            font-size: 1.3em;
            font-weight: bold;
            color: #88746b;
        }

        .schedule-day {
            background: linear-gradient(135deg, #88746b, #6B5B73);
            color: #FEFCF8;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .schedule-topic {
            font-size: 1.2em;
            font-weight: 600;
            color: #88746b;
            margin-bottom: 10px;
        }

        .schedule-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .lesson-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn-join {
            background: linear-gradient(135deg, #51cf66, #40c057);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
        }

        .btn-materials {
            background: linear-gradient(135deg, #339af0, #228be6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-materials:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(51, 154, 240, 0.4);
        }

        .empty-schedule {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-schedule .icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .week-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #FEFCF8, #F5F0E8);
            border-radius: 15px;
            border: 2px solid #88746b;
        }

        .nav-btn {
            background: linear-gradient(135deg, #88746b, #6B5B73);
            color: #FEFCF8;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(136, 116, 107, 0.4);
        }

        .current-week {
            font-size: 1.2em;
            font-weight: 600;
            color: #88746b;
        }

        @media (max-width: 768px) {
            .schedule-header {
                flex-direction: column;
                gap: 10px;
            }

            .schedule-details {
                grid-template-columns: 1fr;
            }

            .lesson-actions {
                flex-direction: column;
            }

            .week-navigation {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">
                <span>📚 Кабинет ученика</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Главная</a></li>
                <li><a href="/cabinet">Выйти</a></li>
            </ul>
        </nav>

        <div class="main-container">
            <!-- Боковое меню -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3 class="dashboard-title">Панель ученика</h3>
                </div>
                <ul class="sidebar-menu">
                    <li class="menu-item">
                        <a href="/student-cabinet" style="display: block; text-decoration: none; color: inherit;">
                            📊 Обзор
                        </a>
                    </li>
                    <li class="menu-item active">
                        <a href="/student-schedule" style="display: block; text-decoration: none; color: inherit;">
                            📅 Расписание
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="/tests" style="display: block; text-decoration: none; color: inherit;">
                            🧪 Тесты
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Основной контент -->
            <div class="content-area">
                <header class="header">
                    <div class="header-info">
                        <h1>📅 Моё расписание</h1>
                        <h2>Занятия с репетитором</h2>
                        <p class="subtitle">Просмотр запланированных занятий и управление ими</p>
                    </div>
                </header>

                <section class="schedule-container">
                    <!-- Навигация по неделям -->
                    <div class="week-navigation">
                        <button class="nav-btn" onclick="previousWeek()">◀ Предыдущая неделя</button>
                        <div class="current-week" id="currentWeek">20-26 ноября 2025</div>
                        <button class="nav-btn" onclick="nextWeek()">Следующая неделя ▶</button>
                    </div>

                    <!-- Список занятий -->
                    <div class="schedule-list" id="scheduleList">
                        <div class="empty-schedule">
                            <div class="icon">📅</div>
                            <h3>Загрузка расписания...</h3>
                            <p>Пожалуйста, подождите, идет загрузка вашего расписания.</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        // Текущая неделя
        let currentWeekStart = new Date();
        currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay() + 1); // Начало недели (понедельник)

        // Загрузка расписания при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            updateWeekDisplay();
            loadSchedule();
        });

        // Обновление отображения текущей недели
        function updateWeekDisplay() {
            const weekEnd = new Date(currentWeekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);

            const options = { day: 'numeric', month: 'long' };
            const startStr = currentWeekStart.toLocaleDateString('ru-RU', options);
            const endStr = weekEnd.toLocaleDateString('ru-RU', options);
            const year = currentWeekStart.getFullYear();

            document.getElementById('currentWeek').textContent = `${startStr} - ${endStr} ${year}`;
        }

        // Навигация по неделям
        function previousWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            updateWeekDisplay();
            loadSchedule();
        }

        function nextWeek() {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            updateWeekDisplay();
            loadSchedule();
        }

        // Загрузка расписания
        async function loadSchedule() {
            const scheduleList = document.getElementById('scheduleList');

            try {
                // Показываем индикатор загрузки
                scheduleList.innerHTML = `
                    <div class="empty-schedule">
                        <div class="icon">⏳</div>
                        <h3>Загрузка расписания...</h3>
                        <p>Пожалуйста, подождите.</p>
                    </div>
                `;

                const response = await fetch('/api/schedule');
                const data = await response.json();

                if (data.schedule && data.schedule.length > 0) {
                    renderSchedule(data.schedule);
                } else {
                    scheduleList.innerHTML = `
                        <div class="empty-schedule">
                            <div class="icon">📅</div>
                            <h3>Расписание пусто</h3>
                            <p>На данную неделю у вас нет запланированных занятий.</p>
                            <p>Обратитесь к репетитору для согласования расписания.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Ошибка загрузки расписания:', error);
                scheduleList.innerHTML = `
                    <div class="empty-schedule">
                        <div class="icon">❌</div>
                        <h3>Ошибка загрузки</h3>
                        <p>Не удалось загрузить расписание. Пожалуйста, попробуйте позже.</p>
                    </div>
                `;
                updateStats([]);
            }
        }

        // Отображение расписания
        function renderSchedule(schedule) {
            const scheduleList = document.getElementById('scheduleList');
            let scheduleHTML = '';

            const dayNames = {
                'monday': 'Понедельник',
                'tuesday': 'Вторник',
                'wednesday': 'Среда',
                'thursday': 'Четверг',
                'friday': 'Пятница',
                'saturday': 'Суббота',
                'sunday': 'Воскресенье'
            };

            schedule.forEach(lesson => {
                const dayName = dayNames[lesson.day_of_week] || lesson.day_of_week;

                scheduleHTML += `
                    <div class="schedule-item">
                        <div class="schedule-header">
                            <div class="schedule-time">${lesson.start_time} - ${lesson.end_time}</div>
                            <div class="schedule-day">${dayName}</div>
                        </div>
                        <div class="schedule-topic">${lesson.topic_title}</div>
                        <div class="schedule-details">
                            <div class="detail-item">
                                <span>🎯</span>
                                <span>${lesson.exam_type === 'oge' ? 'Подготовка к ОГЭ' : 'Подготовка к ЕГЭ'}</span>
                            </div>
                        </div>
                        ${lesson.lesson_link ? `
                        <div class="lesson-actions">
                            <button class="btn-join" onclick="joinLesson('${lesson.lesson_link}')">
                                🎬 Присоединиться к занятию
                            </button>
                            <button class="btn-materials" onclick="viewMaterials(${lesson.id})">
                                📚 Материалы занятия
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            scheduleList.innerHTML = scheduleHTML;
        }


        // Вспомогательные функции
        function getStatusText(status) {
            const statusMap = {
                'active': 'Активно',
                'completed': 'Завершено',
                'cancelled': 'Отменено',
                'rescheduled': 'Перенесено'
            };
            return statusMap[status] || status;
        }

        function getNextLessonDate(dayOfWeek) {
            const dayMap = {
                'monday': 1,
                'tuesday': 2,
                'wednesday': 3,
                'thursday': 4,
                'friday': 5,
                'saturday': 6,
                'sunday': 0
            };

            const today = new Date();
            const targetDay = dayMap[dayOfWeek];
            const currentDay = today.getDay();

            let daysToAdd = targetDay - currentDay;
            if (daysToAdd < 0) {
                daysToAdd += 7;
            }

            const nextDate = new Date(today);
            nextDate.setDate(today.getDate() + daysToAdd);
            return nextDate;
        }

        function joinLesson(link) {
            window.open(link, '_blank');
        }

        function viewMaterials(lessonId) {
            alert(`Просмотр материалов для занятия #${lessonId}`);
            // Здесь можно реализовать переход к материалам занятия
        }

        // Проверяем авторизацию при загрузке
        fetch('/api/check-auth')
            .then(response => response.json())
            .then(data => {
                if (!data.authenticated || data.user.role !== 'student') {
                    window.location.href = '/cabinet';
                }
            })
            .catch(error => {
                console.error('Ошибка проверки авторизации:', error);
            });

        // Добавляем стили для статистики
        const style = document.createElement('style');
        style.textContent = `
            .quick-stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-top: 30px;
            }

            .stat-card {
                background: linear-gradient(135deg, #FEFCF8, #F5F0E8);
                padding: 25px;
                border-radius: 15px;
                text-align: center;
                border: 2px solid #88746b;
                position: relative;
                overflow: hidden;
            }

            .stat-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(90deg, #88746b, #6B5B73);
            }

            .stat-card h3 {
                color: #88746b;
                margin: 0 0 15px 0;
                font-size: 1.1em;
            }

            .stat-number {
                font-size: 2.5em;
                font-weight: bold;
                color: #88746b;
                margin: 0;
            }

            .stat-description {
                color: #666;
                font-size: 0.9em;
                margin: 10px 0 0 0;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
