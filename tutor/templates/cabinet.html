<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="root">
        <div style="text-align: center; padding: 50px; color: white;">
            <h2>Загрузка личного кабинета...</h2>
        </div>
    </div>

    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>

    <script>
        console.log('🚀 Cabinet.js начал загрузку...');

        // Компонент личного кабинета
        function Cabinet() {
            console.log('🔧 Cabinet компонент создан');

            // Состояние для формы входа
            const [loginData, setLoginData] = React.useState({
                username: '',
                password: ''
            });
            const [isLoading, setIsLoading] = React.useState(false);

            console.log('🔄 Инициализировано состояние:', loginData);

            // Обработчик изменения полей ввода
            const handleInputChange = (field, value) => {
                console.log('📝 Изменение поля:', field, value);
                setLoginData(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            // Обработчик отправки формы
            const handleLogin = async (e) => {
                e.preventDefault();

                console.log('🔄 Начало обработки входа', loginData);

                if (!loginData.username || !loginData.password) {
                    console.log('❌ Пустые поля');
                    alert('Пожалуйста, заполните все поля');
                    return;
                }

                setIsLoading(true);
                console.log('⏳ Установлен isLoading:', true);

                try {
                    console.log('📨 Отправка запроса на /api/login...');
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            username: loginData.username,
                            password: loginData.password
                        })
                    });

                    console.log('✅ Ответ получен, статус:', response.status);
                    const data = await response.json();
                    console.log('📊 Данные ответа:', data);

                    if (data.success) {
                        console.log('✅ Успешный вход, редирект на:', data.redirect_url);
                        alert('✅ ' + data.message);
                        // Редирект на соответствующий кабинет
                        window.location.href = data.redirect_url;
                    } else {
                        console.log('❌ Ошибка входа:', data.message);
                        alert('❌ ' + data.message);
                    }
                } catch (error) {
                    console.error('❌ Ошибка fetch:', error);
                    alert('⚠️ Ошибка при входе в системе');
                } finally {
                    setIsLoading(false);
                    console.log('⏳ Установлен isLoading:', false);
                }
            };

            // Обработчик нажатия Enter
            const handleKeyPress = (e) => {
                console.log('⌨️ Нажата клавиша:', e.key);
                if (e.key === 'Enter') {
                    handleLogin(e);
                }
            };

            console.log('🎨 Рендеринг компонента...');

            return React.createElement('div', {className: 'container'},
                // Навигационное меню
                React.createElement('nav', {className: 'navbar'},
                    React.createElement('div', {className: 'nav-brand'},
                        React.createElement('span', null, '👤 Личный кабинет')
                    ),
                    React.createElement('ul', {className: 'nav-menu'},
                        React.createElement('li', null,
                            React.createElement('a', {href: '/'}, 'Главная')
                        ),
                        React.createElement('li', null,
                            React.createElement('a', {href: '#login'}, 'Вход')
                        )
                    )
                ),

                // Заголовок
                React.createElement('header', {className: 'header', id: 'login'},
                    React.createElement('div', {className: 'header-info'},
                        React.createElement('h1', null, 'Личный кабинет'),
                        React.createElement('h2', null, 'Управление обучением'),
                        React.createElement('p', {className: 'subtitle'}, 'Отслеживайте прогресс и планируйте занятия'),

                        // Блок с тестовыми данными
                        React.createElement('div', {className: 'test-accounts'},
                            React.createElement('div', {className: 'account-list'},
                                React.createElement('div', {className: 'account-item'},
                                ),

                            )
                        )
                    )
                ),

                // Форма входа
                React.createElement('section', {className: 'login-section'},
                    React.createElement('h2', null, '🔐 Вход в систему'),
                    React.createElement('div', {className: 'login-container'},
                        React.createElement('form', {className: 'login-form', onSubmit: handleLogin},
                            React.createElement('div', {className: 'form-group'},
                                React.createElement('label', null, 'Логин:'),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Введите логин',
                                    value: loginData.username,
                                    onChange: (e) => handleInputChange('username', e.target.value),
                                    onKeyPress: handleKeyPress,
                                    disabled: isLoading
                                })
                            ),
                            React.createElement('div', {className: 'form-group'},
                                React.createElement('label', null, 'Пароль:'),
                                React.createElement('input', {
                                    type: 'password',
                                    placeholder: 'Введите пароль',
                                    value: loginData.password,
                                    onChange: (e) => handleInputChange('password', e.target.value),
                                    onKeyPress: handleKeyPress,
                                    disabled: isLoading
                                })
                            ),
                            React.createElement('button', {
                                type: 'submit',
                                className: 'login-btn',
                                disabled: isLoading
                            }, isLoading ? '⏳ Вход...' : '🔐 Войти'),
                            React.createElement('div', {className: 'login-links'},
                                React.createElement('a', {href: '#', className: 'forgot-password'}, 'Забыли пароль?')
                            )
                        )
                    )
                )
            );
        }

        console.log('📁 Cabinet.js загружен');
    </script>
    <script>
        console.log('🔄 Загрузка Cabinet компонента...');

        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM загружен, рендерим Cabinet...');

            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined' && typeof Cabinet !== 'undefined') {
                // Используем старый метод для React 16/17
                ReactDOM.render(React.createElement(Cabinet), document.getElementById('root'));
                console.log('✅ Cabinet компонент отрендерен (React 16/17)');
            } else {
                console.error('❌ React или Cabinet не найдены');
            }
        });
    </script>
</body>
</html>
