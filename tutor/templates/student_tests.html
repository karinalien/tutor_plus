<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тесты - Кабинет ученика</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .dashboard-title {
            color: #FEFCF8 !important;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header-info h1, .header-info h2, .subtitle {
            color: #FEFCF8;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .test-block {
            background: linear-gradient(135deg, #FEFCF8, #F5F0E8);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #88746b;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .test-block:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(136, 116, 107, 0.15);
        }
        .test-block h3 {
            color: #88746b;
            margin: 0 0 10px 0;
            font-size: 1.3em;
        }
        .test-block p {
            color: #666;
            margin: 0 0 15px 0;
        }
        .test-status {
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-completed { color: #28a745; }
        .status-not-started { color: #c23a4c; }
        .test-actions { display: flex; align-items: center; gap: 10px; }
        .delete-btn { background: none; border: none; cursor: pointer; padding: 5px; font-size: 1.3em; color: #c9a89a; }
        .delete-btn:hover { color: #d9534f; }
    </style>
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="nav-brand"><span>📚 Кабинет ученика</span></div>
        <ul class="nav-menu">
            <li><a href="/">Главная</a></li>
            <li><a href="/cabinet">Выйти</a></li>
        </ul>
    </nav>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header"><h3 class="dashboard-title">Панель ученика</h3></div>
            <ul class="sidebar-menu">
                <li class="menu-item"><a href="/student-cabinet">📊 Обзор</a></li>
                <li class="menu-item"><a href="/student-cabinet#schedule">📅 Расписание</a></li>
                <li class="menu-item"><a href="/student-cabinet#materials">📚 Материалы</a></li>
                <li class="menu-item active"><a href="/student-tests">🧪 Тесты</a></li>
            </ul>
        </div>
        <div class="content-area">
            <header class="header">
                <div class="header-info">
                    <h1>🧪 Тесты и задания</h1>
                    <h2 class="subtitle">Проверка знаний</h2>
                </div>
            </header>
            <section class="login-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="color: #6B5B73;">Доступные тесты</h2>
                </div>
                <div id="tests-container">
                    <!-- Сюда будут динамически добавляться блоки с тестами -->
                </div>
            </section>
        </div>
    </div>
</div>

<script>
    function fetchTests() {
        fetch('/api/student/tests')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const container = document.getElementById('tests-container');
                    container.innerHTML = ''; 

                    if (data.tests.length === 0) {
                        container.innerHTML = '<p>У вас пока нет доступных тестов.</p>';
                        return;
                    }

                    data.tests.forEach(test => {
                        const testBlock = document.createElement('div');
                        testBlock.className = 'test-block';

                        const statusText = test.percentage !== null 
                            ? `Пройден: ${test.percentage.toFixed(1)}%` 
                            : 'Не пройден';
                        const statusClass = test.percentage !== null ? 'status-completed' : 'status-not-started';
                        const buttonText = test.percentage !== null ? 'Пересдать' : 'Перейти';
                        const testUrl = `/tests/${test.id}`;

                        testBlock.innerHTML = `
                            <h3>${test.material_name}</h3>
                            <p class="test-status ${statusClass}">${statusText}</p>
                            <div class="test-actions">
                                <a href="${testUrl}" class="login-btn" style="padding: 8px 20px;">${buttonText}</a>
                                <button class="delete-btn" data-testid="${test.id}" title="Удалить тест">🗑️</button>
                            </div>
                        `;
                        container.appendChild(testBlock);
                    });
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки тестов:', error);
                document.getElementById('tests-container').innerHTML = '<p>Произошла ошибка при загрузке тестов.</p>';
            });
    }

    document.addEventListener('DOMContentLoaded', function() {
        fetchTests();

        // Делегируем обработку клика по кнопке удаления
        document.getElementById('tests-container').addEventListener('click', (e) => {
            const btn = e.target.closest('.delete-btn');
            if (btn) {
                const testId = btn.dataset.testid;
                if (confirm('Удалить этот тест? Это действие необратимо.')) {
                    fetch(`/api/tests/${testId}`, { method: 'DELETE' })
                        .then(r => r.json())
                        .then(data => {
                            alert(data.message || (data.success ? 'Тест удален' : 'Ошибка удаления'));
                            if (data.success) fetchTests();
                        })
                        .catch(err => {
                            console.error('Ошибка удаления:', err);
                            alert('Произошла ошибка при удалении теста.');
                        });
                }
            }
        });
    });
</script>

</body>
</html>
